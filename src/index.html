<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Synchronous on purpose: airgap.js must run before any other script so it can regulate them.
         src must match LFXFooter.TRANSCEND_SCRIPT_URL in @linuxfoundation/lfx-ui-core so the footer doesn't inject it again. -->
    <script src="https://transcend-cdn.com/cm/f484e2d0-ad2e-43a9-9d64-d07f6fa20966/airgap.js" data-cfasync="false" data-prompt="auto"></script>
    <title>EasyCLA</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Automate your CLA management process, and make it easier for developers to start contributing to your projects while remaining compliant."
    />
    <meta
      name="keywords"
      content="cla, easycla, open source Linux foundation, lfx, linux foundation, contributor license agreement"
    />
    <meta name="author" content="The Linux Foundation" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://cdn.platform.linuxfoundation.org/assets/lf-favicon.png"
    />
  </head>

  <body>
    <lfx-header-v2
      product="LF CLA"
      id="lfx-header-v2"
      docslink="https://docs.linuxfoundation.org/lfx/easycla/v2-current"
      faqlink="https://docs.linuxfoundation.org/lfx/easycla/v2-current/getting-started/easycla-faqs"
    >
    </lfx-header-v2>
    <app-root></app-root>
  </body>
</html>
