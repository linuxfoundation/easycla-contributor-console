<div class="col-12 corporate-dashboard">
  <div class="container">
    <div class="row justify-content-center align-items-center">
      <div class="col-xs-11 col-sm-11 col-md-11 col-lg-8 select-company-model">
        <div class="col-12 header">Select Organization</div>

        <div class="col-12 body">
          <div class="col-12">
            <div class="row justify-content-center align-items-center">
              <div class="col-xs-12 col-sm-12 col-md-12 col-lg-8">
                <form [formGroup]="form">
                  <input
                    id="msg"
                    type="text"
                    autocomplete="off"
                    [value]="searchBoxValue"
                    formControlName="companyName"
                    placeholder="Type Your Organization Name"
                    (input)="onCompanyKeypress($event)"
                  />
                  <i
                    class="building-icon fas fa-building"
                    (click)="toggleDropdown()"
                  ></i>
                </form>
              </div>

              <div
                *ngIf="hasShowDropdown"
                class="col-xs-12 col-sm-12 col-md-12 col-lg-8"
              >
                <div class="col-12 dropdown-container">
                  <div class="companies">
                    <div
                      class="col-12"
                      *ngIf="
                        form.controls.companyName.errors &&
                        (form.controls.companyName.dirty ||
                          form.controls.companyName.touched)
                      "
                    >
                      <span
                        *ngIf="!form.controls.companyName.errors.required"
                        class="error"
                        >{{ minLengthValidationMsg }}
                      </span>
                    </div>

                    <!--Repeated error message but it is requirement when no search text is present-->
                    <div class="col-12 error" *ngIf="emptySearchError">
                      {{ minLengthValidationMsg }}
                    </div>

                    <div
                      class="col-12 error"
                      *ngIf="
                        noCompanyFound && organizationList.list.length <= 0
                      "
                    >
                      Could not find any matching organization.
                    </div>

                    <ng-container
                      *ngFor="let organization of signedOrganizations"
                      [ngTemplateOutlet]="organizationRow"
                      [ngTemplateOutletContext]="{ $implicit: organization }"
                    ></ng-container>

                    <div
                      class="col-12 list-note"
                      *ngIf="
                        signedOrganizations.length === 0 && unsignedTotal > 0
                      "
                    >
                      None of these has signed a Corporate CLA yet.
                    </div>

                    <div
                      class="col-12"
                      *ngIf="!unsignedListVisible && unsignedTotal > 0"
                    >
                      <button
                        type="button"
                        class="show-unsigned"
                        (click)="onShowUnsigned()"
                      >
                        Show {{ unsignedTotal }} more without a signed CLA
                      </button>
                    </div>

                    <ng-container *ngIf="unsignedListVisible">
                      <ng-container
                        *ngFor="let organization of unsignedOrganizations"
                        [ngTemplateOutlet]="organizationRow"
                        [ngTemplateOutletContext]="{ $implicit: organization }"
                      ></ng-container>

                      <div class="col-12 list-note" *ngIf="hiddenUnsignedCount > 0">
                        {{ hiddenUnsignedCount }} more. Type more of the name to
                        narrow the list.
                      </div>
                    </ng-container>
                  </div>
                  <div class="footer col-12">
                    <span class="legend"
                      ><span class="verified-badge" aria-hidden="true"
                        ><ng-container *ngTemplateOutlet="verifiedSeal"></ng-container
                      ></span>
                      Verified organization</span
                    >
                    <span class="add-organization" *ngIf="addOrganizationVisible">
                      <span>Not listed? </span>
                      <button
                        type="button"
                        class="click-here"
                        (click)="onClickAddOrganization()"
                      >
                        + Add your organization
                      </button>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row justify-content-center" style="margin: 30px 0 30px 0;">
            <div class="col-12">
              <app-consent (termAccepted)="hasTermAccepted = $event"></app-consent>
            </div>
        </div>

          <div class="col-12 buttons" [ngClass]="{ 'mt-30': selectedCompany }">
            <div class="row justify-content-center align-items-center">
              <div class="col-xs-6 col-sm-6 col-md-4 col-lg-3">
                <button
                  tabindex="-1"
                  type="button"
                  class="btn"
                  (click)="onClickBack()"
                >
                  Go Back
                </button>
              </div>
              <div class="col-xs-6 col-sm-6 col-md-4 col-lg-3">
                <button
                  tabindex="-1"
                  type="button"
                  [disabled]="selectedCompany === '' || !hasTermAccepted"
                  class="btn inactive"
                  [ngClass]="{ active: selectedCompany !== '' && hasTermAccepted }"
                  (click)="onClickProceed()"
                >
                  Proceed
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #verifiedSeal>
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path
      class="seal"
      d="M12 0.5L14.48 2.73L17.75 2.04L18.79 5.21L21.96 6.25L21.27 9.52L23.5 12L21.27 14.48L21.96 17.75L18.79 18.79L17.75 21.96L14.48 21.27L12 23.5L9.52 21.27L6.25 21.96L5.21 18.79L2.04 17.75L2.73 14.48L0.5 12L2.73 9.52L2.04 6.25L5.21 5.21L6.25 2.04L9.52 2.73Z"
    />
    <path class="check" d="M7.5 12.3L10.6 15.3L16.5 9.2" />
  </svg>
</ng-template>

<ng-template #organizationRow let-organization>
  <button
    type="button"
    class="col-12 item"
    (click)="onSelectCompany(organization)"
  >
    <span class="organization-line">
      <span class="ellipsis organization-name">{{
        organization.organization_name
      }}</span>
      <span
        *ngIf="organization.has_b2b_account === true"
        class="verified-badge"
        role="img"
        aria-label="Verified organization"
        title="Verified organization"
        ><ng-container *ngTemplateOutlet="verifiedSeal"></ng-container
      ></span>
      <span *ngIf="organization.ccla_enabled" class="ccla-signed"
        ><i class="fas fa-check" aria-hidden="true"></i> CCLA signed</span
      >
    </span>
    <span class="ellipsis organization-website">
      {{ organization.organization_website }}
    </span>
  </button>
</ng-template>

<ng-template #addCompany let-modal>
  <div class="model">
    <div class="modal-body">
      <app-modal-header
        title="CREATE NEW ORGANIZATION"
        showCloseBtn="true"
        (closeDialogEmitter)="onClickClose()"
      >
      </app-modal-header>
      <app-add-company-modal></app-add-company-modal>
    </div>
  </div>
</ng-template>

<ng-template #signedCLANotFoundModal let-modal>
  <div class="model">
    <div class="modal-body">
      <app-modal-header
        title="No Signed CLA Found"
        showCloseBtn="true"
        (closeDialogEmitter)="onClickClose()"
      >
      </app-modal-header>
      <app-cla-not-signed-modal
        (yesEmitter)="openWithDismiss(configureCLAManager)"
        (noEmitter)="openWithDismiss(identifyCLAManager)"
      >
      </app-cla-not-signed-modal>
    </div>
  </div>
</ng-template>

<ng-template #identifyCLAManager let-modal>
  <div class="model">
    <div class="modal-body">
      <app-modal-header
        title="Identify CLA Manager"
        showCloseBtn="true"
        (closeDialogEmitter)="onClickClose()"
      >
      </app-modal-header>
      <app-identify-cla-manager-modal></app-identify-cla-manager-modal>
    </div>
  </div>
</ng-template>

<ng-template #configureCLAManager let-modal>
  <div class="model">
    <div class="modal-body">
      <app-modal-header
        title="Configuring CLA Manager Settings"
        [showCloseBtn]="hideDialogCloseBtn"
        (closeDialogEmitter)="onClickClose()"
      >
      </app-modal-header>
      <app-configure-cla-manager-modal
        (showCloseBtnEmitter)="hideShowCloseBtn($event)"
      >
      </app-configure-cla-manager-modal>
    </div>
  </div>
</ng-template>

<ng-template #successModal let-modal>
  <div class="model">
    <div class="modal-body">
      <div class="row justify-content-center success-dialog">
        <div class="col-auto">
          <i *ngIf="!hasError" class="fas fa-check-circle logo green"></i>
          <i
            *ngIf="hasError"
            class="fas fas fa-exclamation-triangle logo red"
          ></i>
        </div>
        <div class="col-12 title">{{ title }}</div>
        <p class="col-11 success-message" [innerHTML]="message"></p>
        <div class="col-4">
          <button
            tabindex="-1"
            type="button"
            class="success-btn"
            (click)="onClickModalSuccessBtn()"
          >
            {{ hasError ? 'Proceed' : 'Exit EasyCLA' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #warningModal let-modal>
  <div class="model">
    <div class="modal-body">
      <div class="row justify-content-center success-dialog">
        <div class="col-12 title">{{ title }}</div>
        <p class="col-11 success-message" [innerHTML]="message"></p>
        <div class="col-4">
          <button
            tabindex="-1"
            type="button"
            class="success-btn"
            (click)="onClickExitCLA()"
          >
            Go Back
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-template>
